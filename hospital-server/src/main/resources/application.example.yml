server:
  port: 8080

spring:
  application:
    name: hospital-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hospital_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 请替换为你的MySQL密码

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

  rabbitmq:
    host: localhost
    port: 5672
    username: hospital
    password: 请替换为你的RabbitMQ密码
    virtual-host: /
    connection-timeout: 3s

    listener:
      simple:
        retry:
          # 消费失败后启用有限次数重试
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

        # 重试失败后交给死信交换机，不放回原队列死循环
        default-requeue-rejected: false

  flyway:
    # 启用Flyway
    enabled: true

    # 数据库版本SQL所在位置
    locations: classpath:db/migration

    # 已完成首次基线后关闭，避免连接错误数据库时被自动标记
    baseline-on-migrate: false

    # 把当前已有数据库结构标记为V1
    baseline-version: 1

    # 启动时校验已经执行过的SQL是否被修改
    validate-on-migrate: true

    # 禁止Flyway执行清空数据库操作
    clean-disabled: true

    # SQL文件使用UTF-8
    encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: 请替换为长度足够的Base64密钥
  expiration: 7200000
