name: hospital-management

services:
  hospital-nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: hospital-nacos

    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m

    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"

    volumes:
      - hospital-nacos-data:/home/nacos/data

    restart: unless-stopped

volumes:
  hospital-nacos-data: